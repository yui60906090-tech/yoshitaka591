<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>所見作成アプリ（調査書・指導要録）Gemini版</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1f2328;--mu:#667085;--bd:#d0d5dd;--ac:#2b6cb0;--ac2:#e8f0fa;--wn:#fff4d6;--wt:#7a5b00;--dg:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--sf:#1f2227;--tx:#e8eaed;--mu:#9aa3af;--bd:#3a3f47;--ac:#7db3f0;--ac2:#243447;--wn:#3a3216;--wt:#f0d78a;--dg:#ff7b6b}}
:root[data-theme="dark"]{--bg:#16181c;--sf:#1f2227;--tx:#e8eaed;--mu:#9aa3af;--bd:#3a3f47;--ac:#7db3f0;--ac2:#243447;--wn:#3a3216;--wt:#f0d78a;--dg:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.w{max-width:1280px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1 1 130px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{background:var(--ac2);border-color:var(--ac);font-weight:700}
button.d{color:var(--dg);border-color:var(--dg)}button:disabled{opacity:.5}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.wn{background:var(--wn);color:var(--wt);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.opt{display:block;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
.opt.on{border-color:var(--ac);background:var(--ac2)}
.g{display:grid;grid-template-columns:230px 1fr;gap:12px}
@media(max-width:720px){.g{grid-template-columns:1fr}}
.sl{max-height:420px;overflow:auto;border:1px solid var(--bd);border-radius:8px}
.si{display:flex;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--bd);cursor:pointer}
.si.on{background:var(--ac2)}.si span{flex:1}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.mu{color:var(--mu);font-size:13px}a{color:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:5px 7px;vertical-align:top;font-size:13px}
.chip{min-width:46px;padding:7px 8px}.chip.has{background:var(--ac2);border-color:var(--ac)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag{padding:1px 9px;border-radius:10px;font-size:12px;border:1px solid var(--bd)}.tag.ok{background:var(--ac2);border-color:var(--ac)}.tag.no{background:var(--wn);color:var(--wt)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:17px;margin:6px 0}.gd{background:var(--ac2);border:1px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:16px}
summary{cursor:pointer;padding:4px 0}.pv{margin-top:8px;font-size:14px;white-space:pre-wrap}.pv>div{border-top:1px dashed var(--bd);padding:6px 0}
#rv{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 12px 24px}
.rvb{max-width:1150px;margin:0 auto}.rg{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}@media(max-width:800px){.rg{grid-template-columns:1fr}}
.ob{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px;white-space:pre-wrap}
#pa{display:none}
@media print{#rv{display:none!important}body>.w{display:none}#pa{display:block;color:#000;background:#fff}#pa td,#pa th{border:1px solid #000;font-size:11pt}}
.nr input{flex:1 1 150px;min-width:120px}.nr select{padding:9px 6px}.cr{border:1px solid var(--bd);border-radius:10px;padding:6px 8px;margin:6px 0}
.tw td,.tw th{min-width:150px}.tw td:first-child,.tw th:first-child{min-width:0}
.stp{margin:10px 0;padding:8px 10px;border-left:4px solid var(--ac);background:var(--ac2);border-radius:6px}.stp .no{font-weight:700;color:var(--ac);margin-right:4px}.flow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.flow span{background:var(--ac2);border:1px solid var(--ac);border-radius:16px;padding:2px 12px;font-size:14px}
.stk{position:sticky;top:0;z-index:5;max-height:32vh;overflow:auto;padding:8px 10px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.fnav{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px;align-items:center;background:var(--sf);border:2px solid var(--ac);border-radius:14px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fnav b{font-size:15px;white-space:nowrap}.fnav button{font-size:17px;padding:12px 18px;font-weight:700}
.stk .r{margin:0}.stk .chip{min-width:38px;padding:3px 7px}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.eg>*{min-width:0}@media(max-width:960px){.eg{grid-template-columns:1fr}}
.sec{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--sf)}
details.sec>summary{font-size:16px;font-weight:700;padding:2px 0 2px 10px;border-left:5px solid var(--ac);cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"　▼ ひらく";font-size:13px;font-weight:400;color:var(--ac)}
details.sec[open]>summary::after{content:"　▲ とじる"}
details.sec[open]>summary{margin-bottom:10px}
details.nt{margin:6px 0}details.nt>summary{font-size:13px;color:var(--ac);padding:2px 0}
.sec>h3{font-size:16px;margin:0 0 8px;padding-left:10px;border-left:5px solid var(--ac)}
.tg{display:grid;grid-template-columns:48px 1fr 1fr;gap:8px 10px;align-items:center}
.tg .hd{font-size:13px;font-weight:700;color:var(--mu)}
.tg .yr{font-size:18px;font-weight:700;text-align:center;background:var(--ac2);border-radius:8px;padding:8px 0}
.tg input,.cl input,.cl select{width:100%;font-size:17px;padding:11px 12px;min-width:0}
.tg input:focus,.cl input:focus,.cl select:focus{outline:3px solid var(--ac2);border-color:var(--ac)}
.cl{display:grid;grid-template-columns:minmax(0,2fr) 104px minmax(0,1.3fr) 64px;gap:6px 10px;align-items:end;margin:4px 0}
.cl .hd{font-size:13px;font-weight:700;color:var(--mu)}
.cl.sub{border-top:1px dashed var(--bd);padding-top:8px;margin-top:10px}
.cl .d{padding:11px 6px}
.pvt{background:var(--ac2);border-radius:10px;padding:8px 12px;margin:10px 0 6px;font-size:15px;white-space:pre-wrap}
@media(max-width:720px){.tg{grid-template-columns:40px 1fr}.tg .hd.h2{display:none}.tg .hd.h1{display:none}.cl{grid-template-columns:1fr 1fr}.cl .hd{display:none}.cl>:first-child{grid-column:1/-1}}
</style></head><body>
<div class="w">
<h1>所見作成アプリ（調査書・指導要録）</h1>
<div class="tabs" id="tabs"></div>
<div id="gd"></div>
<div id="main"></div>
</div>
<div id="rv" style="display:none"></div>
<div id="pa"></div>
<script>
let S={key:'',model:'gemini-3.8-flash',mode:null,classes:[],cur:null,stu:null,tab:0,len:{ns:200,nt:100,os:250,yo:250}};
const KEY='shoken_v1';
try{const x=localStorage.getItem(KEY);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
S.mode='num';try{S.classes.forEach(c=>c.students.forEach(s=>{s.name=''}))}catch(e){}
/* 一括貼り付けなどで混ざった長い・複数の語がつながった履歴は自動で消す */
try{if(S.dl)['c','k','club','role'].forEach(k=>{if(Array.isArray(S.dl[k]))S.dl[k]=S.dl[k].filter(v=>typeof v==='string'&&v.length<=30&&!/[、，,：:\n]/.test(v))})}catch(e){}
if(!S.model||/^gemini-(1\.5|2\.0|2\.5)-flash(-lite)?$/.test(S.model))S.model='gemini-3.8-flash';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.fbLive)fbPushSoon()};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const cls=()=>S.classes.find(c=>c.id===S.cur);
const stu=()=>cls()?.students.find(s=>s.id===S.stu);
const lab=s=>S.mode==='name'?`${s.no} ${s.name||''}`:`${s.no}番`;
const renum=c=>c.students.forEach((s,i)=>s.no=i+1);
const blank=()=>({id:uid(),no:0,name:'',y1:'',y2:'',y3:'',prev:'',ns:'',nt:'',os:'',yo:''});
function go(t){S.tab=t;save();draw()}
function draw(){
 $('tabs').innerHTML=['① クラスを作る','② 所見を入れる','③ 文章を作る','④ 出力する','❓ 使い方・APIキー','📅 出席日数（進路用）'].map((n,i)=>`<button class="${S.tab===i?'on':''}" onclick="go(${i})">${n}</button>`).join('');
 $('gd').innerHTML=S.tab===5?'':guide();[t1,t2,tGen,t3,t4,tAtt][S.tab]();
}
/* ① */
function t1(){
 const cs=S.classes;
 $('main').innerHTML=`
 <details class="c" ${S.classes.length?'':'open'}><summary><b>📖 このアプリでできること（はじめての方はお読みください）</b></summary>
  <div style="margin-top:6px">1・2年のときの担任の先生が書いた<b>指導要録の所見</b>をもとに、AIが次の3種類の文章の<b>下書き</b>を作ります。</div>
  <ul><li>奈良県の調査書：総合所見・特別活動の記録</li><li>大阪府の調査書：活動／行動の記録</li><li>3年の指導要録：総合所見（昨年度と違う表現にもできます）</li></ul>
  <div>作った文章は、画面で読んで直せます。直したあと、Excelや印刷で出力します。進め方は上の「次にやること」の案内に従えば大丈夫です。</div>
  <div class="wn">AIの文章は下書きです。事実と違うところがないか、必ず担任が読んで確認・修正してください。</div></details>
 <div class="c"><h2>クラス編成</h2><div class="mu">クラス名（例：3年1組）を入れて「クラス追加」を押します。複数のクラスを作れます。名前の変更・削除もできます。</div>
  <div class="r"><input id="cn" placeholder="クラス名（例：3年1組）"><button class="p" onclick="addC()">クラス追加</button></div>
  <div>${cs.map(c=>`<div class="r"><b>${esc(c.name)}</b><span class="mu">${c.students.length}人</span>
   <button onclick="renC('${c.id}')">名前変更</button><button class="d" onclick="delC('${c.id}')">削除</button></div>`).join('')||'<span class="mu">まだクラスがありません</span>'}</div></div>
 <div class="c"><h2>生徒の表示方法</h2>
  <label class="opt ${S.mode==='num'?'on':''}"><input type="radio" name="m" ${S.mode==='num'?'checked':''} onchange="setM('num')"> <b>出席番号だけ</b>（おすすめ）
   <div class="mu">氏名を入力しません。出力・CSVも番号のみ。個人情報の漏えいリスクが低く、貼り付け時は番号で照合します。</div></label>
  <div class="wn">⚠ 注意：所見文の作成時、入力した所見はAI（Google Gemini）に送信されます。氏名を入力するかどうかに関わらず、学校・教育委員会の情報管理ルールで外部AIの利用が許可されているか必ず確認してください。名前を入力する場合でも、所見本文に氏名・固有名詞（学校名など）は書かないでください。生成文は必ず担任が読んで確認・修正してから提出してください。共有をオンにしない間、データはこの端末のブラウザ内にのみ保存されます。</div>
  </div>
 <div class="c"><h2>文字数の目安</h2><div class="mu">AIが作る文章のおよその長さです（提出先の枠に合わせて変えてください）。ぴったりの字数にはならないので、実際の字数は③の確認画面で見て調整してください。</div><div class="r">
  奈良 総合所見<input type="number" style="width:80px" value="${S.len.ns}" onchange="S.len.ns=+this.value;save()">
  奈良 特別活動<input type="number" style="width:80px" value="${S.len.nt}" onchange="S.len.nt=+this.value;save()">
  大阪<input type="number" style="width:80px" value="${S.len.os}" onchange="S.len.os=+this.value;save()">
  指導要録<input type="number" style="width:80px" value="${S.len.yo}" onchange="S.len.yo=+this.value;save()"></div></div>
 <div class="r"><button class="p big" onclick="go(1)" ${S.mode&&S.classes.length?'':'disabled'}>次へ：② 所見を入れる ▶</button></div>
 <div class="mu">データ全消去（クラス・生徒・所見・文章・出席日数をすべて消します。APIキーは残ります。先にExcelで保存してください）：<button class="d" onclick="if(confirm('すべてのデータを消します。よろしいですか？')){S={key:S.key,model:S.model,mode:null,classes:[],cur:null,stu:null,tab:0,len:S.len,dl:S.dl};save();draw()}">全データ削除</button></div>
 <div class="c"><h2>データの引っ越し・バックアップ</h2><div class="mu">入力したデータは、このブラウザの中にだけ保存されています。別のパソコンやURLへ移すとき、念のための控えにも使えます。ファイルには生徒の所見が入るので、取り扱いに注意してください（APIキーは含みません）。</div><div class="r"><button class="p" onclick="bkExport()">データを書き出す（ファイル保存）</button><label class="mu" style="cursor:pointer">ファイルから読み込む：<input type="file" accept=".json,application/json" onchange="bkImport(this)"></label></div></div>
 ${fbCard()}`;
}
function addC(){const n=$('cn').value.trim();if(!n)return;const c={id:uid(),name:n,students:[]};S.classes.push(c);S.cur=S.cur||c.id;save();draw()}
function renC(id){const c=S.classes.find(x=>x.id===id);const n=prompt('新しいクラス名',c.name);if(n){c.name=n;save();draw()}}
function delC(id){if(!confirm('このクラスと生徒を削除しますか？'))return;S.classes=S.classes.filter(c=>c.id!==id);if(S.cur===id){S.cur=S.classes[0]?.id||null;S.stu=null}save();draw()}
function setM(m){S.mode='num';save();draw()}

/* ===== 奈良県調査書：特別活動／スポーツ・文化活動等（選択式） ===== */
const CT={eiken:{n:'英検',org:'日本英語検定協会',nm:'実用英語技能検定',lv:['5級','4級','3級','準2級','2級','準1級','1級']},
 kanken:{n:'漢検',org:'日本漢字能力検定協会',nm:'日本漢字能力検定',lv:['10級','9級','8級','7級','6級','5級','4級','3級','準2級','2級','準1級','1級']},
 suken:{n:'数検',org:'日本数学検定協会',nm:'実用数学技能検定',lv:['11級','10級','9級','8級','7級','6級','5級','4級','3級','準2級','2級','準1級','1級']},
 koh:{n:'硬筆書写',org:'日本書写技能検定協会',nm:'硬筆書写技能検定',lv:['5級','4級','3級','準2級','2級','準1級','1級']},
 mou:{n:'毛筆書写',org:'日本書写技能検定協会',nm:'毛筆書写技能検定',lv:['5級','4級','3級','準2級','2級','準1級','1級']}};
const DL={
 dl_c:['学級委員','学習委員','体育委員','図書委員','保健委員','美化委員','給食委員','放送委員','文化委員','広報委員','環境委員','生活委員','選挙管理委員','生徒会本部役員','生徒会本部役員会長','生徒会本部役員副会長','生徒会本部役員書記','生徒会本部役員会計'],
 dl_k:['国語係','社会係','数学係','理科係','音楽係','美術係','保健体育係','技術・家庭係','英語係','黒板係','配布係','掲示係','給食係','美化係','生き物係','保健係','電気係','時間割係','連絡係','レク係'],
 dl_club:['バレーボール部','バスケットボール部','サッカー部','野球部','ソフトボール部','ソフトテニス部','テニス部','卓球部','バドミントン部','陸上競技部','水泳部','剣道部','柔道部','ハンドボール部','吹奏楽部','美術部','科学部','合唱部','放送部','書道部','家庭科部','パソコン部','演劇部','茶道部'],
 dl_role:['キャプテン','副キャプテン','部長','副部長','主将','副主将','会計','マネージャー'],
 dl_org:['県体育協会','市体育協会','県中学校体育連盟','県教育委員会','県','市','県バレーボール協会','市バレーボール協会','県バスケットボール協会','県サッカー協会','県陸上競技協会','県水泳連盟','県卓球協会','県バドミントン協会','県ソフトテニス連盟','県剣道連盟','県柔道連盟','県吹奏楽連盟','県合唱連盟','日本吹奏楽連盟'],
 dl_cname:[],
 dl_res:['優勝','準優勝','3位','2位','1位','ベスト4','ベスト8','ベスト16','金賞','銀賞','銅賞','特選','入選','最優秀賞','優秀賞','知事賞','出場']};
function xx(s){const x=s.x=s.x||{};x.c=x.c||['','',''];x.k=x.k||['','',''];x.cert=x.cert||[];x.club=x.club||'';x.yrs=x.yrs||'3';x.role=x.role||'';x.etc=x.etc||'';x.aw=x.aw||[];x.cb=x.cb||[];return x}
const nowFY=()=>{const d=new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1};
const z2h=t=>String(t).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
const cnKey=v=>v.replace(/第[0-9０-９]+回/g,'第#回').replace(/令和[0-9０-９]+年度/g,'令和#年度');
const cnAdv=(v,n)=>n?v.replace(/第([0-9０-９]+)回/g,(m,d)=>'第'+(+z2h(d)+n)+'回').replace(/令和([0-9０-９]+)年度/g,(m,d)=>'令和'+(+z2h(d)+n)+'年度'):v;
const cnList=()=>((S.dl||{}).cname||[]).map(v=>cnAdv(v,Math.max(0,nowFY()-((S.cnY||{})[v]||nowFY()))));
const dlist=id=>id==='dl_cname'?cnList():DL[id].concat(((S.dl||{})[id.slice(3)]||[]).filter(v=>!DL[id].includes(v)&&!/[、，：]/.test(v)));
const nAdd=(v,id,suf)=>{v=(v||'').trim();if(!v)return'';const l=dlist(id);return l.includes(v)?v:l.includes(v+suf)?v+suf:v};
const nC=v=>nAdd(v,'dl_c','委員'),nK=v=>nAdd(v,'dl_k','係'),nB=v=>nAdd((v||'').trim().replace(/^(男子|女子)/,''),'dl_club','部');
function rem(k,v){

function parseRows(t){
 const rows=[];let f='',row=[],q=false;t=t.replace(/\r\n?/g,'\n');
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"'&&f==='')q=true;
  else if(c==='\t'){row.push(f);f=''}
  else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
  else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}
 while(rows.length&&rows[rows.length-1].every(x=>!x.trim()))rows.pop();
 return rows;
}

function bkApply(p){

 if(ks.length>1&&ks.every(k=>/^[ck]\d$/.test(k))){
  const one=R.some(r=>String(r[0]||'').trim())&&R.every(r=>r.slice(1).every(x=>!String(x||'').trim()))&&R.some(r=>/[、，,]/.test(String(r[0]||'')));
  if(one){
   const yrs=[...new Set(ks.map(k=>+k[1]))].sort((a,b)=>a-b);
   for(let i=0;i<R.length;i++){
    const parts=String(R[i][0]||'').split(/[、，,]/).map(x=>x.trim()).filter(Boolean);
    const o={};let yi=0;
    parts.forEach(t=>{const kk=/係$/.test(t)?'k':'c';

   }
  }

 tg.forEach((s,i)=>ks.forEach((k,j)=>{const v=String((R[i]||[])[j]||'').trim();sv(s,k,v)}));
 save();draw();
 alert(`${tg.length}人分の「${nm}」を入力しました（${tg[0]?lab(tg[0]):''}〜${tg.length?lab(tg[tg.length-1]):''}）。`);
}

async function callAI(p,onWait){
 if(!S.key)throw{code:'nokey'};
 const base=S.model||'gemini-3.8-flash';
 const models=[base].concat(['gemini-3.7-flash','gemini-3.5-flash','gemini-3.1-flash-lite'].filter(m=>m!==base));
 let last={code:503},gone=false;
 const W=async(sec,msg)=>{for(let k=sec;k>0;k--){if(stopF)throw{code:'stop'};onWait&&onWait(msg+'（'+k+'秒後にもう一度試します）');await sleep(1000)}};
 for(const m of models){
  if(m!==base)onWait&&onWait('「'+models[models.indexOf(m)-1]+'」が'+(last.code||'?')+'で失敗→「'+m+'」で試しています…');
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent';
  let think=/^gemini-3/.test(m);
  for(let t=0;t<3;t++){
   if(stopF)throw{code:'stop'};
   const body=JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:Object.assign({responseMimeType:'application/json',temperature:0.8},think?{thinkingConfig:{thinkingLevel:'low'}}:{})});
   let r;const ctl=new AbortController();curCtl=ctl;const to=setTimeout(()=>ctl.abort(),45000);
   try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body,signal:ctl.signal})}
   catch(e){clearTimeout(to);if(stopF)throw{code:'stop'};last={code:'network',message:'通信できないか、AIの応答がとても遅い状態です'};break}
   clearTimeout(to);
   if(r.status===429){last={code:429};if(m===base&&t<1){await W(15,'利用が集中しています');continue}break}
   if([500,502,503,504].includes(r.status)){let mm='';try{mm=(await r.json()).error.message}catch(e){}last={code:r.status,message:mm};if(t<1){await W(5,'AIが混み合っています('+r.status+')');continue}break}
   if(!r.ok){let mm='';try{mm=(await r.json()).error.message}catch(e){}last={code:r.status,message:mm};if(r.status===404){gone=true;break}if(r.status===400&&think){think=false;t--;continue}if(m!==base&&r.status===400)break;throw last}
   try{const j=await r.json();const tx=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');const out=JSON.parse(tx.replace(/```json|```/g,'').trim());if(gone&&m!==base){S.model=m;save()}return out}
   catch(e){last={code:'format',message:'AIの返答を読み取れませんでした'};if(t<2){await sleep(2000);continue}break}
  }
 }
 throw last;
}

function doXlsx(){
 const e=getEx(),sn=e.title.replace(/[\[\]:*?\/\\]/g,'').slice(0,31)||'Sheet1';
 const a=document.createElement('a');a.href=URL.createObjectURL(xlsxBlob(e,sn));
 a.download=e.title.replace(/\s+/g,'_')+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function doCsv(){
 const e=getEx(),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const csv='\uFEFF'+[e.head].concat(e.rows).map(r=>r.map(q).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download=e.title.replace(/\s+/g,'_')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
